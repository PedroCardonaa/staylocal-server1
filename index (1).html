<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>StayLocal</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7}
header{background:#FF5A5F;color:#fff;padding:16px 24px}
main{max-width:900px;margin:20px auto;padding:0 16px}
input,button{padding:8px;margin-right:8px}
button{background:#FF5A5F;color:#fff;border:0}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
</style>
</head>
<body>
<header>
<h1>StayLocal</h1>
<p>Airbnb listings and what is within walking distance</p>
<a href="api.html" style="color:#fff">API (raw JSON)</a>
</header>
<main>
<form id="f">
<input id="cityIn" placeholder="City" required>
<input id="maxIn" type="number" placeholder="Max price">
<button>Search</button>
</form>
<p id="msg"></p>
<div id="out"></div>
</main>
<script>
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const out = document.getElementById('out');
const city = document.getElementById('cityIn');
const max = document.getElementById('maxIn');
f.onsubmit = async function (e) {
  e.preventDefault();
  msg.textContent = 'Loading...';
  out.innerHTML = '';
  let url = '/api/search.json?city=';
  url += encodeURIComponent(city.value);
  if (max.value) url += '&maxPrice=' + max.value;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Server 2 returned ' + r.status);
    const d = await r.json();
    if (!d.length) {
      msg.textContent = 'No listings found.';
      return;
    }
    const cols = Object.keys(d[0]);
    let h = '<table><tr>';
    for (const c of cols) h += '<th>' + c + '</th>';
    h += '</tr>';
    for (const row of d) {
      h += '<tr>';
      for (const c of cols) h += '<td>' + (row[c] ?? '') + '</td>';
      h += '</tr>';
    }
    out.innerHTML = h + '</table>';
    msg.textContent = d.length + ' listing(s)';
  } catch (err) {
    msg.textContent = 'Could not load data: ' + err.message;
  }
};
</script>
</body>
</html>
